<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>VideoBoost Pro | Test checkout</title><style>body{margin:0;background:#111827;color:#eef2ff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(540px,86vw);padding:28px;background:#202b3d;border:1px solid #43516b;border-radius:18px}h1{font-size:25px}p{line-height:1.6;color:#cbd5e1}input{box-sizing:border-box;width:100%;padding:12px;background:#111827;color:white;border:1px solid #64748b;border-radius:8px}button{background:#a59aff;color:#17142d;border:0;padding:12px 18px;border-radius:8px;font-weight:700;margin-top:12px;cursor:pointer}</style></head><body><main><h1>VideoBoost Pro — Test checkout</h1><p>Return to the same extension installation that started your purchase. Copy the checkout session ID below into Pro tools → Checkout session ID, then select Claim purchase.</p><p>Payment status will be verified by the license server. No real money is charged in test mode.</p><input id="session" readonly aria-label="Checkout session ID"><button id="copy" disabled>Copy session ID</button><p id="status" role="status"></p></main><script>const id=new URLSearchParams(location.search).get('session_id')||'';const field=document.getElementById('session'),button=document.getElementById('copy'),status=document.getElementById('status');if(/^cs_test_[A-Za-z0-9]+$/.test(id)){field.value=id;button.disabled=false;history.replaceState(null,'',location.pathname);}else{status.textContent='No valid test session was received. Begin checkout from VideoBoost.';}button.onclick=async()=>{try{await navigator.clipboard.writeText(field.value);status.textContent='Copied. Return to VideoBoost.';}catch{field.select();status.textContent='Copy the selected ID manually.';}};</script></body></html>
